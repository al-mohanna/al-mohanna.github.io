<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0a3527">
<base href="/">
<meta name="description" content="مكتبة ذكية لتلاوات وخطب فضيلة الشيخ د. خالد المهنا إمام المسجد النبوي، مرتبة بالصلاة والتاريخ الهجري.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="تلاوات الشيخ د. خالد المهنا">
<meta property="og:image" content="/icon-512.png">
<title>تلاوات الشيخ د. خالد المهنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--r:18px;--ease:cubic-bezier(.22,1,.36,1);--side:272px;--fa:'IBM Plex Sans Arabic',system-ui,sans-serif;--fq:'Amiri',serif;
--bg:#f5f1e6;--bg2:#ece5d3;--surface:#fffdf7;--text:#13261e;--muted:#66756c;--green:#0e4a36;--green-d:#08301f;--gold:#a98330;--gold-l:#d8b463;--gold-s:rgba(176,138,53,.12);--line:rgba(14,74,54,.12);--shadow:0 1px 2px rgba(8,48,31,.05),0 10px 26px -14px rgba(8,48,31,.22);--glass:rgba(250,247,238,.8);--pc:#0e5a40;--oc:#9a4f2c}
[data-theme=dark]{--bg:#05110d;--bg2:#0b1d17;--surface:#0d221b;--text:#efe8d6;--muted:#93a89d;--green:#1b7254;--green-d:#0b2e22;--gold:#d6b366;--gold-l:#ecd08e;--gold-s:rgba(214,179,102,.12);--line:rgba(214,179,102,.14);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -16px rgba(0,0,0,.7);--glass:rgba(7,22,17,.8);--pc:#63caa0;--oc:#e3a47f}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--fa);background:var(--bg);color:var(--text);min-height:100vh;transition:background .45s,color .45s;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}

/* sidebar */
.side{position:fixed;top:0;right:0;bottom:0;width:var(--side);background:var(--green-d);color:#efe8d6;display:flex;flex-direction:column;padding:22px 14px;overflow-y:auto;z-index:20}
[data-theme=dark] .side{background:#06150f;border-left:1px solid var(--line)}
.side .pat{position:absolute;inset:0;width:100%;height:100%;opacity:.05;pointer-events:none}
.logo{display:flex;gap:12px;align-items:center;padding:4px 8px 20px;border-bottom:1px solid rgba(227,196,126,.16);margin-bottom:8px;position:relative}
.lg{width:46px;height:46px;flex:none}
.logo b{font-family:var(--fq);font-size:21px;display:block;line-height:1.25}
.logo small{color:rgba(239,232,214,.6);font-size:12px}
.nl{font-size:11.5px;color:rgba(239,232,214,.42);padding:14px 12px 6px;font-weight:600;position:relative}
.side a.ni{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:rgba(239,232,214,.78);font-size:14.5px;transition:background .25s,color .25s;position:relative}
.side a.ni:hover{background:rgba(255,255,255,.05);color:#fff}
.side a.ni.on{background:linear-gradient(270deg,rgba(214,179,102,.18),rgba(214,179,102,.03));color:#ecd08e}
.side a.ni.on::after{content:'';position:absolute;right:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:#d6b366}
.srcbox{margin-top:auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(227,196,126,.14);font-size:12.5px;position:relative;margin-top:22px}
.srcbox .sbt{font-weight:600;color:#ecd08e;margin-bottom:8px}
.sr{display:flex;align-items:center;gap:8px;padding:3px 0;color:rgba(239,232,214,.8)}
.sr span{margin-right:auto;color:rgba(239,232,214,.45);font-size:11.5px}
.sr i{width:8px;height:8px;border-radius:50%;background:#3fcf8e;animation:live 2.2s infinite}
.srcbox small{display:block;margin-top:8px;color:rgba(239,232,214,.45)}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(63,207,142,.55)}70%{box-shadow:0 0 0 7px rgba(63,207,142,0)}100%{box-shadow:0 0 0 0 rgba(63,207,142,0)}}

/* main + top */
.main{margin-right:var(--side);min-width:0;min-height:100vh}
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;height:calc(64px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.top .brand{display:none;align-items:center;gap:9px;font-family:var(--fq);font-size:19px;font-weight:700}
.top .brand .lg{width:34px;height:34px}
.pt{font-family:var(--fq);font-size:22px;font-weight:700}
.pill{font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--gold-s);color:var(--gold);font-weight:600;white-space:nowrap}
.sp{flex:1}
.tb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);transition:color .25s,border-color .25s,transform .25s}
.tb:hover{color:var(--gold);border-color:var(--gold)}
.tb:active{transform:scale(.92)}
.view{padding:26px 30px 70px;max-width:1260px;margin:0 auto}
.anim>*{animation:up .6s var(--ease) both}
.anim>*:nth-child(2){animation-delay:.05s}.anim>*:nth-child(3){animation-delay:.1s}.anim>*:nth-child(4){animation-delay:.15s}.anim>*:nth-child(n+5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:30px;background:radial-gradient(120% 140% at 90% 0%,#1a6d4f 0%,#0b3d2b 46%,#05211a 100%);color:#f3ecd9;padding:42px 42px 30px;box-shadow:0 30px 60px -30px rgba(5,33,26,.6)}
.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.13;pointer-events:none}
.hero::after{content:'';position:absolute;width:520px;height:520px;border-radius:50%;left:-160px;bottom:-280px;background:radial-gradient(circle,rgba(227,196,126,.22),transparent 65%);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.35fr 1fr;gap:36px;align-items:center;z-index:1}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:#e6c77f;border:1px solid rgba(227,196,126,.35);padding:5px 13px;border-radius:99px;background:rgba(0,0,0,.12)}
.hero h1{font-family:var(--fq);font-size:clamp(34px,4.6vw,58px);line-height:1.3;margin:16px 0 12px;font-weight:700}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#f6e2a6,#c99d45);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:rgba(243,236,217,.76);max-width:48ch;line-height:1.95;font-size:15px}
.cta{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn-gold{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;background:linear-gradient(145deg,#e6c674,#ad8531);color:#082a1d;font-weight:700;font-size:15px;transition:transform .25s var(--ease),box-shadow .25s;box-shadow:0 10px 24px -12px rgba(173,133,49,.9)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-gold:active{transform:scale(.97)}
.btn-gold svg{width:16px;height:16px}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:14px;border:1px solid rgba(243,236,217,.28);color:#f3ecd9;font-weight:600;font-size:15px;transition:background .25s}
.btn-ghost:hover{background:rgba(255,255,255,.07)}
.latest{position:relative;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(227,196,126,.32);border-radius:160px 160px 26px 26px;padding:54px 24px 26px;backdrop-filter:blur(6px);transition:transform .45s var(--ease),border-color .3s}
.latest:hover{transform:translateY(-4px);border-color:rgba(227,196,126,.6)}
.latest::before{content:'';position:absolute;inset:8px;border-radius:152px 152px 20px 20px;border:1px dashed rgba(227,196,126,.2);pointer-events:none}
.latest .lb{font-size:12px;color:#e6c77f;font-weight:600}
.latest .lt{font-family:var(--fq);font-size:36px;font-weight:700;line-height:1.35;margin-top:4px}
.latest .ls{color:rgba(243,236,217,.7);font-size:13.5px}
.pbtn{width:64px;height:64px;border-radius:50%;margin:18px auto 0;display:grid;place-items:center;background:linear-gradient(145deg,#ecd082,#ad8531);color:#082a1d;position:relative}
.pbtn svg{width:24px;height:24px;margin-right:-3px}
.pbtn::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid #e6c77f;animation:ring 2.4s infinite}
@keyframes ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}
.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid rgba(227,196,126,.18)}
.stats b{display:block;font-family:var(--fq);font-size:30px;color:#ecd08e;line-height:1.2}
.stats small{color:rgba(243,236,217,.6);font-size:12.5px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.tile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;transition:transform .4s var(--ease),border-color .3s,box-shadow .4s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-4px);border-color:var(--gold)}
.tile .ti{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--gold-s);color:var(--gold);transition:transform .4s var(--ease)}
.tile:hover .ti{transform:rotate(-8deg) scale(1.06)}
.tile b{font-size:16px;font-weight:600}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.6}
.tile .n{position:absolute;top:16px;left:18px;font-family:var(--fq);font-size:22px;color:var(--gold);font-weight:700}

/* sections */
.sec{margin-top:36px}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sec-h h2{font-family:var(--fq);font-size:27px;font-weight:700;display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:'۞';color:var(--gold);font-size:20px}
.sec-h a{color:var(--gold);font-size:14px;font-weight:600}
.ph{margin:4px 0 20px}
.ph h1{font-family:var(--fq);font-size:clamp(32px,4vw,44px);line-height:1.3}
.ph p{color:var(--muted);max-width:70ch}
.crumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13.5px;margin-bottom:4px;flex-wrap:wrap}
.crumb a{color:var(--gold);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.rows-scroll{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}

/* card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);transition:transform .4s var(--ease),border-color .3s;animation:up .55s var(--ease) both;animation-delay:calc(min(var(--i),12) * 35ms)}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.c-top{display:flex;justify-content:space-between;align-items:center}
.badge{font-size:12px;font-weight:600;padding:3px 11px;border-radius:99px}
.b-p{background:color-mix(in srgb,var(--pc) 13%,transparent);color:var(--pc)}
.b-f{background:var(--gold-s);color:var(--gold)}
.b-o{background:color-mix(in srgb,var(--oc) 13%,transparent);color:var(--oc)}
.b-r{background:var(--bg2);color:var(--muted)}
.src{display:inline-grid;place-items:center;width:26px;height:26px}
.src svg{width:22px;height:22px}
.src b{font-size:15px;font-weight:700}
.c-title{font-family:var(--fq);font-size:21px;font-weight:700;line-height:1.35}
.c-sub{color:var(--gold);font-size:13.5px;flex-wrap:wrap;display:flex;gap:6px;align-items:center}
.c-sub .fl{color:var(--gold);font-weight:600}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.c-meta span{display:inline-flex;gap:5px;align-items:center}
.c-meta svg{width:15px;height:15px}
.c-note{font-size:12.5px;color:var(--gold);background:var(--gold-s);padding:7px 11px;border-radius:11px;line-height:1.6}
.c-act{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
.play{flex:1;display:flex;justify-content:center;gap:8px;align-items:center;height:42px;border-radius:12px;background:var(--green);color:#fff;font-weight:600;font-size:14px;transition:transform .2s,filter .2s}
.play:hover{filter:brightness(1.15)}
.play:active{transform:scale(.97)}
.play svg{width:15px;height:15px}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);transition:color .25s,border-color .25s}
.ib:hover{color:var(--gold);border-color:var(--gold)}
.fav.on{color:#d0454c;border-color:rgba(208,69,76,.4)}
.fav.on svg{fill:currentColor}
.fav.pop svg{animation:pop .45s var(--ease)}
.card.cand{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-s),var(--shadow);margin-top:6px}
.card.cand::after{content:'مرشّح قوي';position:absolute;top:-11px;left:16px;background:linear-gradient(145deg,#e6c674,#ad8531);color:#082a1d;font-size:11px;font-weight:700;padding:2px 11px;border-radius:99px}
.card.soft{opacity:.9}

.thumb{position:relative;display:block;width:calc(100% + 32px);margin:-16px -16px 6px;aspect-ratio:16/9;overflow:hidden;border-radius:var(--r) var(--r) 0 0;background:var(--bg2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.card:hover .thumb img{transform:scale(1.05)}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(5,33,26,.55),transparent 55%)}
.tdur{position:absolute;bottom:8px;left:10px;z-index:1;background:rgba(0,0,0,.65);color:#fff;font-size:11.5px;padding:2px 7px;border-radius:6px;direction:ltr}
.tplay{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(230,198,116,.92);color:#082a1d;z-index:1;opacity:0;transform:scale(.8);transition:.35s var(--ease)}
.card:hover .tplay{opacity:1;transform:none}
.tplay svg{width:18px;height:18px;margin-right:-2px}
.player{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* seg */
.seg{display:flex;width:max-content;max-width:100%;gap:4px;padding:5px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a,.seg button{padding:8px 16px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;transition:background .35s var(--ease),color .3s,box-shadow .35s}
.seg a i{font-style:normal;font-size:11.5px;opacity:.7;margin-right:4px}
.seg .on{background:var(--surface);color:var(--gold);box-shadow:var(--shadow)}
.more{display:block;margin:24px auto 0;padding:12px 30px;border-radius:14px;border:1px solid var(--gold);color:var(--gold);font-weight:600;transition:background .25s}
.more:hover{background:var(--gold-s)}
.info{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:20px;font-size:14px;color:var(--muted);line-height:1.8}
.info svg{color:var(--gold);margin-top:3px}
.empty{text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:22px;color:var(--muted)}
.empty svg{width:40px;height:40px;color:var(--gold);margin-bottom:6px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:2px}

/* date */
.dpanel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.dpanel .seg{margin:0}
.inp,select{font:inherit;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:13px;height:48px;padding:0 12px;font-size:15px;width:100%;outline:none;transition:border-color .25s}
.inp:focus,select:focus{border-color:var(--gold)}
.dsel{display:grid;grid-template-columns:1fr 1.7fr 1.3fr;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--muted);transition:border-color .25s,color .25s;background:var(--surface)}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.dhead{display:flex;align-items:center;justify-content:center;gap:14px;margin:30px 0 4px;text-align:center}
.dhead .wd{color:var(--gold);font-weight:600;font-size:14px}
.dhead h2{font-family:var(--fq);font-size:clamp(28px,4vw,38px);line-height:1.3}
.dhead p{color:var(--muted);font-size:14px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);position:relative;margin:22px auto 30px;max-width:620px}
.tl::before{content:'';position:absolute;top:30px;right:16.6%;left:16.6%;height:2px;background:linear-gradient(270deg,var(--gold),color-mix(in srgb,var(--gold) 40%,transparent),var(--line))}
.node{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.node .dot{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--fq);font-size:24px;font-weight:700;transition:transform .3s var(--ease);color:var(--muted)}
.node:hover .dot{transform:scale(1.07)}
.node.has .dot{border-color:var(--gold);color:var(--gold)}
.node.mainn .dot{background:linear-gradient(145deg,#e6c674,#ad8531);color:#082a1d;border:0;box-shadow:0 0 0 6px var(--gold-s)}
.node.mainn .dot::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);animation:ring 2.4s infinite}
.node b{font-size:13.5px}
.node small{font-size:11.5px;color:var(--muted)}
.late{margin-top:34px;border:1px solid var(--line);border-radius:26px;padding:22px;background:linear-gradient(180deg,var(--gold-s),transparent 55%)}
.late h3{font-family:var(--fq);font-size:27px;display:flex;gap:10px;align-items:center}
.late h3 svg{color:var(--gold);width:24px;height:24px}
.late>p{color:var(--muted);margin:2px 0 6px;font-size:14px}
.dg{margin-top:20px}
.dg h4{font-size:14px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:center;font-weight:500}
.dg h4 span{background:var(--surface);border:1px solid var(--line);padding:2px 11px;border-radius:99px;color:var(--gold);font-weight:700}
.nav2{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none;transition:color .25s,border-color .25s}
.nav2:hover{color:var(--gold);border-color:var(--gold)}

/* archive */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ycard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);transition:transform .4s var(--ease),border-color .3s;animation:up .55s var(--ease) both;animation-delay:calc(var(--i) * 45ms)}

/* ---------- smart search: surahs (with typos), prayers, Hijri & Gregorian dates ---------- */
const SN=SURAH.map(n=>norm(n).trim());
const STOP=new Set(['سوره','سور','صلاه','تلاوه','تلاوات','شيخ','مهنا','خالد','من','في','و','يوم','ليله','عام','سنه','هـ','ه']);
const PW=[[/^(فجر|فجريه|فجريات)$/,['fajr'],'صلاة الفجر'],[/^مغرب$/,['maghrib'],'صلاة المغرب'],[/^(عشاء|عشا)$/,['isha'],'صلاة العشاء'],[/^جمعه$/,['jumuah','khutbah'],'الجمعة'],[/^(خطبه|خطب)$/,['khutbah'],'خطب الجمعة'],[/^(تراويح|تروايح)$/,['taraweeh'],'التراويح'],[/^(تهجد|قيام)$/,['taraweeh'],'التهجد والقيام',/تهجد|قيام/],[/^وتر$/,null,'الوتر',/وتر/],[/^قنوت$/,null,'القنوت',/قنوت/],[/^عيد$/,['fitr','adha'],'العيد'],[/^استسقاء$/,['istisqa'],'الاستسقاء'],[/^كسوف$/,['kusuf'],'الكسوف'],[/^(مرتل|مصحف)$/,['murattal'],'المصحف المرتل'],[/^(قصير|قصيره|شورتس|shorts)$/,['short'],'المقاطع القصيرة'],[/^(اصدار|مجمع|مجموع)$/,['collection'],'الإصدارات المجمّعة'],[/^(ظهر|عصر)$/,[],'']];
const MN=HM.map(m=>norm(m).trim());
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function findSurah(w){
  if(w.length<2)return 0;
  let i=SN.indexOf(w);if(i>=0)return i+1;
  if(w.length>=3){i=SN.findIndex(s=>s.startsWith(w));if(i>=0)return i+1}
  if(w.length===3){const k=SN.findIndex(s=>s.length===3&&lev(w,s)===1);if(k>=0)return k+1}
  if(w.length>=4){let best=0,bd=9;SN.forEach((s,k)=>{const d=lev(w,s);if(d<bd){bd=d;best=k+1}});if(bd<=(w.length>=7?2:1))return best}
  return 0;
}
function parseQ(q){
  const raw=q;q=norm(q).replace(/[^\p{L}\p{N}\s\/\-.]/gu,' ').trim();
  const Q={s:[],types:null,typeL:[],rx:[],y:0,m:0,d:0,gy:0,g:'',text:[],silent:false,why:[]};
  let m;
  if((m=q.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))){const a=+m[1];if(a>1900)Q.g=`${a}-${pad(+m[2])}-${pad(+m[3])}`;else{Q.y=a;Q.m=+m[2];Q.d=+m[3]}q=q.replace(m[0],' ')}
  else if((m=q.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))){const a=+m[3];if(a>1900)Q.g=`${a}-${pad(+m[2])}-${pad(+m[1])}`;else{Q.y=a;Q.m=+m[2];Q.d=+m[1]}q=q.replace(m[0],' ')}
  for(let k=0;k<12;k++){if(q.includes(MN[k])){Q.m=k+1;q=q.replace(MN[k],' ');break}}
  if(!Q.m&&/ربيع (اول|اخر|ثاني)|جماد (اولي|اخره)/.test(q)){const mm=q.match(/ربيع (اول|اخر|ثاني)|جماد (اولي|اخره)/)[0];Q.m={'ربيع اول':3,'ربيع اخر':4,'ربيع ثاني':4,'جماد اولي':5,'جماد اخره':6}[mm];q=q.replace(mm,' ')}
  const W=q.split(/\s+/).filter(Boolean);
  for(let i=0;i<W.length;i++){
    const w=W[i],prev=W[i-1]||'';
    if(/^\d+$/.test(w)){const n=+w;if(n>=1430&&n<1500)Q.y=n;else if(n>=2000&&n<2100)Q.gy=n;else if(n>=1&&n<=30&&Q.m&&!Q.d)Q.d=n;else if(n>=1&&n<=30)Q.d=n;else Q.text.push(w);continue}
    if(STOP.has(w))continue;
    if(i+1<W.length&&SN.includes(w+' '+W[i+1])){Q.s.push(SN.indexOf(w+' '+W[i+1])+1);i++;continue}
    const pw=PW.find(p=>p[0].test(w));
    const asSurah=prev==='سوره'||prev==='سور';
    if(pw&&!pw[2]&&prev!=='صلاه'){const s0=findSurah(w);if(s0){Q.s.push(s0);continue}}
    if(pw&&!(asSurah&&findSurah(w))){if(!pw[2]){Q.silent=true;continue}if(pw[1])Q.types=(Q.types||[]).concat(pw[1]);if(pw[3])Q.rx.push(pw[3]);Q.typeL.push(pw[2]);continue}
    const s=findSurah(w);if(s){Q.s.push(s);continue}
    Q.text.push(w);
  }
  if(!Q.d&&Q.m&&/^\s*\d{1,2}\s/.test(norm(raw)))Q.d=+norm(raw).trim().split(/\s+/)[0];
  return Q;

function matchQ(x,Q,dayTol=0){
  if(Q.s.length&&!Q.s.every(n=>x.s.includes(n)))return false;
  if(Q.types&&!Q.types.includes(x.t))return false;
  if(Q.rx.length&&!Q.rx.every(r=>r.test(x.title+' '+x.verses)))return false;
  if(Q.y&&(x.h?x.h.y:x.year)!==Q.y)return false;
  if(Q.m&&(x.h?x.h.m:x.month)!==Q.m)return false;
  if(Q.d&&!(x.h&&Math.abs(x.h.d-Q.d)<=dayTol))return false;
  if(Q.g&&!(x.d&&Math.abs(Date.parse(x.d)-Date.parse(Q.g))<=dayTol*864e5))return false;
  if(Q.gy&&!((x.d||x.up||'').startsWith(String(Q.gy))))return false;
  if(Q.text.length&&!Q.text.every(t=>x.hay.includes(t)))return false;
  return true;
}
function whyOf(x,Q){

  if(Q.typeL.length)r.push(Q.typeL.join('، '));

  else if(Q.g&&x.d&&x.d!==Q.g){const df=Math.round((Date.parse(x.d)-Date.parse(Q.g))/864e5);r.push(`<b>${df>0?'بعد':'قبل'} ${Math.abs(df)===1?'يوم':Math.abs(df)===2?'يومين':ar(Math.abs(df))+' أيام'}</b> من التاريخ المطلوب`)}
  else if(Q.d||Q.m||Q.y||Q.g)r.push('مطابقة للتاريخ');
  return r.join(' · ');
}

   <section class="det"><div class="rows">
     ${dateOf(it)?`<div><small>تاريخ التلاوة</small><b>${dateOf(it)}</b></div>`:''}
     ${it.up?`<div><small>تاريخ النشر على يوتيوب</small><b>${fmtG(it.up)}</b><small>${upH?fmtH(upH):''}</small></div>`:''}
     <div><small>المدة</small><b>${it.dur}</b></div>
     ${it.views?`<div><small>المشاهدات</small><b>${fmtV(it.views)}</b></div>`:''}
     <div><small>المصدر</small><b>${it.src?it.src:'قناة الشيخ على يوتيوب'}</b></div>
   </div>
   <div class="srcs"><a class="fl-btn" data-yt="${it.id}" href="https://www.youtube.com/watch?v=${it.id}">مشاهدة على يوتيوب</a>${tg.p?`<a class="fl-btn" data-tg="${tg.p}" href="${tgLink(tg.p)}">المنشور على تليجرام</a>`:''}<button class="fl-btn fav ${FAV.has(it.id)?'on':''}" data-fav="${it.id}">${FAV.has(it.id)?'في المفضلة ♥':'أضف للمفضلة ♡'}</button></div>
   </section>
   <div class="pn">${nx?`<a href="#v/${nx.id}">${I('prev')} ${nl} التالية</a>`:'<span></span>'}${pv?`<a href="#v/${pv.id}">${nl} السابقة ${I('next')}</a>`:''}</div>
   ${rel.length?`<section class="sec">${secH(`تلاوات أخرى من سورة ${SURAH[S[0]-1]}`,`#s-${S[0]}`,'الكل')}${grid(rel,'rows-scroll')}</section>`:''}
  </article>`;
}

/* ---------- player (YouTube IFrame API): the video above and the audio bar below share one player ---------- */
let YTP=null,YTT=null,CUR=null;
const ytApi=()=>new Promise(res=>{if(window.YT&&YT.Player)return res();const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();res()};if(!document.getElementById('ytapi')){const sc=document.createElement('script');sc.id='ytapi';sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc)}});
const fmtT=x=>{x=Math.max(0,Math.floor(x||0));const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s2=x%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s2).padStart(2,'0')};
function stopPlayer(){clearInterval(YTT);YTT=null;try{YTP&&YTP.destroy()}catch(e){}YTP=null;CUR=null}
async function startPlayer(id){
  if(YTP&&CUR===id){try{YTP.playVideo()}catch(e){}return}
  stopPlayer();CUR=id;const box=$('#vbox');if(!box)return;box.innerHTML='<div id="ytp"></div>';box.classList.add('on');
  const b=$('#apPlay');if(b)b.innerHTML='<span class="spin"></span>';
  await ytApi();if(!$('#ytp')||CUR!==id)return;
  YTP=new YT.Player('ytp',{videoId:id,host:'https://www.youtube-nocookie.com',playerVars:{autoplay:1,rel:0,playsinline:1,modestbranding:1},
    events:{onReady:e=>{try{e.target.playVideo();const v=$('#apVol');if(v)e.target.setVolume(+v.value)}catch(_){}},
      onStateChange:e=>{const b=$('#apPlay');if(b)b.innerHTML=e.data===1?I('pause'):I('play')},
      onError:()=>{const box=$('#vbox');if(box)box.innerHTML=`<div class="verr">تعذّر تشغيل هذا التسجيل هنا. <a class="lnk" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">افتحه على يوتيوب</a></div>`}}});
  YTT=setInterval(()=>{if(!YTP||!YTP.getDuration)return;const it=BYID[id];const d=YTP.getDuration()||(it&&it.sec),c=YTP.getCurrentTime()||0,sk=$('#apSeek'),cu=$('#apCur');if(!sk){stopPlayer();return}if(!sk.matches(':active'))sk.value=d?Math.round(c/d*1000):0;cu.textContent=fmtT(c)},500);
}
document.addEventListener('input',e=>{
  if(e.target.id==='apSeek'&&YTP&&YTP.getDuration)YTP.seekTo(YTP.getDuration()*e.target.value/1000,true);
  if(e.target.id==='apVol'&&YTP&&YTP.setVolume)YTP.setVolume(+e.target.value);
});
const RATES=[1,1.25,1.5,0.75];

/* ---------- open apps directly on phones ---------- */
const UA=navigator.userAgent,isAnd=/android/i.test(UA),isIOS=/iphone|ipad|ipod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function appOpen(appUrl,webUrl,intent){
  if(isAnd&&intent){location.href=intent;return}
  if(isIOS){const t=setTimeout(()=>{if(!document.hidden)location.href=webUrl},1400);document.addEventListener('visibilitychange',()=>clearTimeout(t),{once:true});location.href=appUrl;return}
  window.open(webUrl,'_blank','noopener');
}
const enc=encodeURIComponent;
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('تم نسخ الرابط ✓')}catch(e){toast(t)}}

/* ---------- router ---------- */
const VIEW=$('#view');
const TITLES={home:'الرئيسية',all:'جميع التلاوات',prayers:'الصلوات',date:'البحث بالتاريخ',archive:'الأرشيف الهجري',mushaf:'المصحف المرتل',surahs:'السور',shorts:'مقاطع قصيرة',rare:'تلاوات غير مؤرّخة',collections:'الإصدارات المجمّعة',fav:'المفضلة',search:'بحث',v:'التلاوة'};
const NAVL={home:['home','الرئيسية'],all:['list','جميع التلاوات'],prayers:['mosque','الصلوات'],mushaf:['book','المصحف المرتل'],surahs:['list','السور'],shorts:['play','مقاطع قصيرة'],date:['cal','البحث بالتاريخ'],archive:['arch','الأرشيف الهجري'],collections:['hourglass','الإصدارات المجمّعة'],fav:['heart','المفضلة'],search:['search','بحث']};
const BN={home:'الرئيسية',prayers:'الصلوات',search:'بحث',mushaf:'المصحف',archive:'الأرشيف'};
document.querySelectorAll('.side a.ni').forEach(a=>{const[k,l]=NAVL[a.dataset.k];a.innerHTML=I(k)+l});
document.querySelectorAll('#bnav a').forEach(a=>{const k=a.dataset.k;a.innerHTML=k==='search'?`<span class="c">${I('search')}</span><span>بحث</span>`:I(NAVL[k][0])+`<span>${BN[k]}</span>`});
document.querySelectorAll('svg.lg').forEach(s=>s.innerHTML=LOGOf());
$('.side .pat').innerHTML=PATf();
$('#tbS').innerHTML=I('search');

function render(scroll=true){
  const raw=decodeURIComponent(location.hash.slice(1))||'home';
  let html,key;
  if(raw.startsWith('v/')){const [,id,act]=raw.split('/');key='v';html=vRec(id);
    VIEW.innerHTML=html;document.querySelectorAll('[data-k]').forEach(e=>e.classList.remove('on'));$('#pt').textContent=TITLES.v;
    if(scroll)window.scrollTo({top:0});const it=BYID[id];document.title=it?plain(titleOf(it))+' | تلاوات الشيخ د. خالد المهنا':'تلاوات الشيخ د. خالد المهنا';
    if(act==='play'){history.replaceState(null,'','#v/'+id);startPlayer(id)}else stopPlayer();
    return}
  stopPlayer();document.title='تلاوات الشيخ د. خالد المهنا – إمام وخطيب المسجد النبوي';
  const [v,a,b]=raw.split('-');
  LIM={};key=v;
  switch(v){
    case 'all':html=vAll(a);break;
    case 'prayers':html=vGroup(a);break;
    case 'friday':html=vGroup(a==='khutbah'?'khutbah':'jumuah');key='prayers';break;
    case 'occasions':html=vGroup(a==='taraweeh'||!a?'taraweeh':'occ');key='prayers';break;
    case 'date':html=vDate();break;
    case 'archive':html=vArchive();break;
    case 'y':html=vYear(a,b);key='archive';break;
    case 'mushaf':html=vMushaf(a);break;
    case 'surahs':html=vSurahs();break;
    case 's':html=vSurah(a);key='surahs';break;
    case 'shorts':html=vShorts();break;
    case 'rare':html=vRare();key='archive';break;
    case 'collections':html=vColl(a);break;
    case 'fav':html=vFav();break;
    case 'search':html=vSearch();break;
    default:html=vHome();key='home';
  }
  VIEW.classList.remove('anim');VIEW.innerHTML=html;void VIEW.offsetWidth;VIEW.classList.add('anim');
  document.querySelectorAll('[data-k]').forEach(e=>e.classList.toggle('on',e.dataset.k===key));
  $('#pt').textContent=TITLES[key]||'';
  if(scroll)window.scrollTo({top:0});
  after(key);
}
function after(key){
  if(key==='home'){countUp();const f=$('#hsf');if(f)f.addEventListener('submit',e=>{e.preventDefault();SQ=$('#hq').value;SNEAR=false;location.hash='#search'})}
  if(key==='all'){const y=$('#afY'),s=$('#afS');y.addEventListener('change',()=>{AF.y=y.value;render(false)});s.addEventListener('change',()=>{AF.sort=s.value;render(false)})}
  if(key==='date'){
    const dIn=$('#dIn');if(dIn)dIn.addEventListener('change',()=>{if(dIn.value){DS.iso=dIn.value;render(false)}});
    ['#hD','#hM','#hY'].forEach(s=>{const e=$(s);if(e)e.addEventListener('change',()=>{const y=+$('#hY').value,m=+$('#hM').value,d=+$('#hD').value;let g=null;for(let k=d;k>=27&&!g;k--)g=H2G[`${y}-${m}-${k}`];if(g){DS.iso=g;render(false)}else toast('هذا التاريخ خارج نطاق الأرشيف')})});
  }
  if(key==='search'){const q=$('#q');let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{SQ=q.value;SNEAR=false;runSearch()},180)});runSearch();if(matchMedia('(min-width:901px)').matches)q.focus()}
}
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),dur=1100;const f=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=ar(Math.round(to*e));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
window.addEventListener('hashchange',()=>render(true));

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const ap=e.target.closest('[data-start],[data-sk],#apPlay,#apRate,[data-tg],[data-yt],[data-ytc]');
  if(ap){const d=ap.dataset;const id=(location.hash.match(/^#v\/([\w-]{11})/)||[])[1];
    if(d.start||ap.id==='apPlay'){if(!YTP||CUR!==id){startPlayer(id);return}YTP.getPlayerState()===1?YTP.pauseVideo():YTP.playVideo();return}
    if(d.sk){if(YTP)YTP.seekTo(Math.max(0,YTP.getCurrentTime()+ +d.sk),true);return}
    if(ap.id==='apRate'){if(!YTP)return;const r=RATES[(RATES.indexOf(YTP.getPlaybackRate())+1)%RATES.length];YTP.setPlaybackRate(r);ap.textContent='السرعة '+r+'×';return}
    if('tg' in d){if(!(isAnd||isIOS))return;e.preventDefault();const post=d.tg,web=tgLink(post);appOpen(`tg://resolve?domain=KhaledAlMuhanna${post?'&post='+post:''}`,web,`intent://resolve?domain=KhaledAlMuhanna${post?'&post='+post:''}#Intent;scheme=tg;S.browser_fallback_url=${enc(web)};end`);return}
    if(d.yt){if(!(isAnd||isIOS))return;e.preventDefault();YTP&&YTP.pauseVideo&&YTP.pauseVideo();const web='https://www.youtube.com/watch?v='+d.yt;appOpen('youtube://www.youtube.com/watch?v='+d.yt,web,`intent://www.youtube.com/watch?v=${d.yt}#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${enc(web)};end`);return}
    if('ytc' in d){if(!(isAnd||isIOS))return;e.preventDefault();const web='https://www.youtube.com/@khalid_almihana';appOpen('youtube://www.youtube.com/@khalid_almihana',web,`intent://www.youtube.com/@khalid_almihana#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=${enc(web)};end`);return}
  }
  const t=e.target.closest('[data-share],[data-fav],[data-more],[data-copy],[data-dset],[data-cal],[data-q],[data-node],[data-af],[data-near]');
  if(!t)return;
  const d=t.dataset;
  if(d.share){const it=BYID[d.share];const url=siteUrl(it);if(navigator.share)navigator.share({title:plain(titleOf(it)),text:shareMsg(it).replace('\n\n'+url,''),url}).catch(()=>{});else copy(shareMsg(it))}
  else if(d.fav){const id=d.fav;FAV.has(id)?FAV.delete(id):FAV.add(id);saveFav();t.classList.toggle('on',FAV.has(id));if(t.classList.contains('fl-btn'))t.textContent=FAV.has(id)?'في المفضلة ♥':'أضف للمفضلة ♡';toast(FAV.has(id)?'أُضيفت إلى المفضلة':'أُزيلت من المفضلة');if(location.hash==='#fav')render(false)}
  else if(d.more){const k=d.more;LIM[k]=(LIM[k]||24)+24;t.closest('[data-list]').innerHTML=listHTML(k)}
  else if(d.copy){copy(d.copy)}
  else if(d.dset){DS.iso=d.dset;render(false);const h=$('.dhead');if(h)h.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(d.cal){DS.cal=d.cal;render(false)}
  else if(d.q){SQ=d.q;SNEAR=false;$('#q').value=SQ;runSearch()}
  else if(d.near){SNEAR=true;runSearch()}
  else if(d.af){const [k,v]=d.af.split(':');AF[k]=v;render(false)}
  else if(d.node){e.preventDefault();const g=$('#g'+d.node)||$('.late');if(g)g.scrollIntoView({behavior:'smooth',block:'center'})}
});

/* ---------- theme ---------- */
const TB=$('#theme');
function setTheme(t){document.documentElement.dataset.theme=t;TB.innerHTML=I(t==='dark'?'sun':'moon');document.querySelector('meta[name=theme-color]').content=t==='dark'?'#05110d':'#0a3527';try{localStorage.setItem('theme',t)}catch(e){}}
let th0=null;try{th0=localStorage.getItem('theme')}catch(e){}
setTheme(th0||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
TB.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));

$('#ytc').textContent=ar(RAW.length)+' مقطع';
try{$('#sync').textContent='آخر تحديث: '+new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab',{dateStyle:'medium',timeStyle:'short'}).format(new Date(SYNC.replace('Z',':00Z')))}catch(e){}
/* short links: /v/ID, /?v=ID, and the old /YYYY/MM/DD/type form */
const pv=location.pathname.match(/^\/v\/([\w-]{11})/)||location.search.match(/[?&]v=([\w-]{11})/);
const pm=location.pathname.match(/^\/(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\/(\w+))?\/?$/);
if(pv)history.replaceState(null,'','/#v/'+pv[1]);
else if(pm){const iso=H2G[`${+pm[1]}-${+pm[2]}-${+pm[3]}`];const f=iso&&SORTED.find(x=>x.d===iso&&(!pm[4]||x.t===pm[4]));history.replaceState(null,'',f?'/#v/'+f.id:'/#date');if(iso)DS.iso=iso}
render(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
