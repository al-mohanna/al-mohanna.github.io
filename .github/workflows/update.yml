name: تحديث التلاوات
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch YouTube uploads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py
      - name: Link Telegram posts
        continue-on-error: true
        run: python scripts/telegram.py
      - name: Build share pages
        run: python scripts/build_meta.py && python scripts/build_pages.py
      - name: Commit if changed
        run: |
          git config user.name "mihana-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json telegram.json meta.json data v
          git diff --cached --quiet || (git commit -m "تحديث تلقائي للتلاوات" && git pull --rebase && git push)
