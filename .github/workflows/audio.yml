name: تجهيز المقاطع الصوتية
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: audio
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -U yt-dlp
      - run: python scripts/audio.py
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: '25'
      - run: |
          git config user.name "audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio.json
          git diff --cached --quiet || (git commit -m "تحديث قائمة المقاطع الصوتية" && git pull --rebase && git push)
